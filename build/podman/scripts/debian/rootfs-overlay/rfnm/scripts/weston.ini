[core]
xwayland=true

[shell]
background-image=/rfnm/Wallpaper.jpg
background-color=0xff002244
background-type=scale-crop
panel-position=bottom
panel-color=0xcc111111
clock-format=minutes
locking=true
lockscreen-icon=/usr/share/icons/gnome/256x256/actions/lock.png
#lockscreen=/usr/share/backgrounds/gnome/Garden.jpg
#animation=zoom
#startup-animation=fade

#[launcher]
#path=/usr/bin/wlogout
#path=/usr/bin/killall weston
#icon=/usr/share/icons/gnome/24x24/actions/system-log-out.png

#[launcher]
#path=/usr/bin/pcmanfm menu://applications
#icon=/usr/share/icons/gnome/24x24/places/gnome-main-menu.png

[launcher]
path=/usr/bin/mousepad 
icon=/usr/share/icons/gnome/24x24/apps/accessories-text-editor.png

[launcher]
path=/usr/sbin/synaptic 
icon=/usr/share/icons/gnome/24x24/apps/system-software-install.png

[launcher]
path=/usr/bin/nemo
icon=/usr/share/icons/hicolor/24x24/apps/nemo.png

[launcher]
path=/usr/bin/weston-terminal
icon=/usr/share/icons/gnome/24x24/apps/utilities-terminal.png

#[launcher]
#path=/usr/bin/firefox-esr
#icon=/usr/share/icons/hicolor/16x16/apps/firefox-esr.png

[touchpad]
#constant_accel_factor = 50
#min_accel_factor = 0.16
max_accel_factor = 1.0
